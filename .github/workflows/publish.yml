name: Publish Diplomatic Atlas

on:
  push:
    branches: [main]
    paths:
      - site-package.zip
      - 'deploy/**'
      - .github/workflows/publish.yml
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: diplomatic-atlas-pages
  cancel-in-progress: false

jobs:
  verify-refresh-deploy:
    if: github.event_name != 'push' || github.event.head_commit.message != '[skip pages]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm website ZIP exists
        run: test -s site-package.zip

      - name: Extract only safe paths
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          archive = pathlib.Path('site-package.zip')
          target = pathlib.Path('site')
          target.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  p = pathlib.PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts or '\\' in info.filename:
                      raise SystemExit('Unsafe ZIP member: ' + info.filename)
                  if info.is_dir():
                      continue
                  dest = target.joinpath(*p.parts)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, dest.open('wb') as out:
                      import shutil
                      shutil.copyfileobj(src,out)
          for required in ('index.html','package.json','src/app.js','scripts/update_news.py'):
              assert (target/required).is_file(), f'Missing {required}'
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and validate Research Studio
        run: |
          cp deploy/studio.js site/src/studio.js
          cp deploy/studio.css site/src/studio.css
          python deploy/integrate_studio.py site
          node --check site/src/studio.js
          node --check site/src/app.js
          node deploy/test_studio.cjs

      - name: Search visibility and cache migration
        run: |
          python deploy/search_visibility.py site
          python - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          root=pathlib.Path('site')
          p=(root/'index.html').read_text()
          assert '<title>Diplomatic Atlas | International Relations Research Platform</title>' in p
          assert 'src/app.js?v=20261124-i18n3' in p
          assert 'src/studio.js?v=20261124-i18n3' in p
          assert 'rel="canonical"' in p
          assert 'research-studio.html' in p
          assert 'Research Studio' in (root/'research-studio.html').read_text()
          assert 'diplomatic-atlas-static-20261124-i18n3' in (root/'service-worker.js').read_text()
          ET.parse(root/'sitemap.xml')
          print('SEO title, unique URLs, cache-busting, and sitemap validated.')
          PY
      - name: Test original bundled application before replacing seed data
        working-directory: site
        run: |
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_news_fetch.py' -v
          python -m unittest discover -s tests -p 'test_events_fetch.py' -v
          python -m unittest discover -s tests -p 'test_indicators_fetch.py' -v
          python -m unittest discover -s tests -p 'test_translations.py' -v
          python -m unittest discover -s tests -p 'test_story_photos.py' -v

      - name: Restore retained snapshots from earlier successful runs
        run: |
          mkdir -p site/data
          for file in liveNews.json liveNews.js liveEvents.json liveEvents.js indicators.json indicators.js; do
            if [ -s "snapshot-cache/$file" ]; then
              cp "snapshot-cache/$file" "site/data/$file"
            fi
          done

      - name: Refresh news from eight publisher and institutional feeds
        id: news
        run: |
          cp site/data/liveNews.json /tmp/atlas-before-news.json
          (cd site && python scripts/update_news.py) || echo "RSS unavailable; retaining previous snapshot."
          if cmp -s /tmp/atlas-before-news.json site/data/liveNews.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract source-qualified geographic meeting pins
        run: |
          (cd site && python scripts/update_events.py --from-news-snapshot) || echo "No new city-verified meeting locations."

      - name: Cache free translation models
        if: steps.news.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-unofficial-language-models-v1
          restore-keys: argos-unofficial-language-models-

      - name: Install optional free translation engine
        if: steps.news.outputs.changed == 'true'
        run: python -m pip install --disable-pip-version-check 'argostranslate>=1.10,<2'
        timeout-minutes: 5
        continue-on-error: true

      - name: Translate new publisher headlines when offline models exist
        if: steps.news.outputs.changed == 'true'
        working-directory: site
        run: python scripts/update_translations.py --install-models
        timeout-minutes: 10
        continue-on-error: true

      - name: Refresh World Bank data only if six hours old
        run: |
          python - <<'PY'
          import pathlib,json,datetime as dt,subprocess
          p=pathlib.Path('site/data/indicators.json')
          last=None
          try:
              value=json.loads(p.read_text()).get('updated_at')
              if value:last=dt.datetime.fromisoformat(value.replace('Z','+00:00'))
          except (OSError,ValueError,TypeError):pass
          now=dt.datetime.now(dt.timezone.utc)
          if last is None or now-last>=dt.timedelta(hours=6):
              subprocess.run(['python','scripts/update_indicators.py'],cwd='site',check=False)
          else:print('WDI refresh not due yet.')
          PY

      - name: Validate refreshed snapshot schemas (including new publishers)
        working-directory: site
        run: |
          npm run check
          python - <<'PY'
          import json, pathlib, datetime
          root=pathlib.Path('data')
          news=json.loads((root/'liveNews.json').read_text(encoding='utf-8'))
          assert isinstance(news.get('items'),list)
          keys=set()
          for item in news['items']:
              assert item.get('publisher') and item.get('title') and item.get('published') and item.get('url','').startswith('https://')
              key=(item['url'],item['published'])
              assert key not in keys, f'Duplicate article: {key[0]}'
              keys.add(key)
          indicators=json.loads((root/'indicators.json').read_text(encoding='utf-8'))
          assert isinstance(indicators.get('countries'),dict)
          for country in ('FRA','DEU'):
              assert country in indicators['countries']
              for metric in ('population','gdp'):
                  row=indicators['countries'][country].get(metric)
                  assert row and isinstance(row.get('value'),(int,float)) and row.get('value')>0, f'{country}.{metric}'
                  # WDI refresh records use the verified top-level World Bank source.
                  # Seed records may additionally include a per-metric source_url.
                  source_url=row.get('source_url')
                  if source_url is not None:
                      assert isinstance(source_url,str) and source_url.startswith('https://'),f'{country}.{metric} invalid source link'
          assert 'World Bank' in indicators.get('source',''), 'Missing World Bank provenance'
          assert indicators.get('indicators',{}).get('population')=='SP.POP.TOTL'
          assert indicators.get('indicators',{}).get('gdp')=='NY.GDP.MKTP.CD'
          for name in ('liveNews.js','liveEvents.js','indicators.js'):
              assert (root/name).is_file(),name
          print(f'Validated {len(news["items"])} new/retained news records and current WDI metrics.')
          PY

      - name: Compare refreshed data with the last published version
        id: publication
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime as dt, hashlib, json, os, pathlib, urllib.request
          root=pathlib.Path('site')
          files=['index.html','service-worker.js','src/app.js','src/studio.js','src/studio.css',
                 'data/liveNews.json','data/liveNews.js','data/liveEvents.json','data/liveEvents.js',
                 'data/indicators.json','data/indicators.js']
          h=hashlib.sha256()
          for name in files:
              h.update(name.encode()+b'\0'+(root/name).read_bytes()+b'\0')
          digest=h.hexdigest()
          status={'schema':1,'fingerprint':digest,'built_at':dt.datetime.now(dt.timezone.utc).isoformat(),
                  'trigger':os.environ['EVENT_NAME'],'sources':{}}
          for name in ('liveNews','liveEvents','indicators'):
              data=json.loads((root/'data'/f'{name}.json').read_text())
              status['sources'][name]={'updated_at':data.get('updated_at'),'status':data.get('status'),
                  'count':len(data.get('items',data.get('countries',{})))}
          (root/'refresh-status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n')
          needed=True
          if os.environ['EVENT_NAME']=='schedule':
              try:
                  url='https://nikkn997.github.io/Diplomatic.Atlas/refresh-status.json?check='+str(int(dt.datetime.now(dt.timezone.utc).timestamp()))
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Accept':'application/json','User-Agent':'DiplomaticAtlasRefresh/1.0'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      deployed=json.load(response)
                  needed=deployed.get('fingerprint')!=digest
              except Exception as error:
                  print('Published version could not be verified; retrying publication:',error)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('needed='+str(needed).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## Refresh status\n\n'+ '\n'.join(
                  f"- {name}: {record['count']} records, source timestamp {record['updated_at']}, status {record['status']}"
                  for name,record in status['sources'].items())+'\n\nPublication needed: '+str(needed)+'\n')
          print(json.dumps(status,ensure_ascii=False))
          PY

      - name: Preserve new snapshots as versioned repository data
        id: persist
        run: |
          # Make a safe copy outside the checkout before syncing with origin/main.
          mkdir -p /tmp/atlas-refresh-snapshots
          for file in liveNews.json liveNews.js liveEvents.json liveEvents.js indicators.json indicators.js; do
            cp "site/data/$file" "/tmp/atlas-refresh-snapshots/$file"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            # The repo may have changed while RSS or translation was running.
            # Never force-push: sync with current main and retry safely.
            git fetch --no-tags origin main
            git reset --hard FETCH_HEAD
            mkdir -p snapshot-cache
            for file in liveNews.json liveNews.js liveEvents.json liveEvents.js indicators.json indicators.js; do
              cp "/tmp/atlas-refresh-snapshots/$file" "snapshot-cache/$file"
            done
            git add snapshot-cache
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Latest snapshots already stored."
              exit 0
            fi
            git commit -m 'data: refresh news and venue snapshots [skip pages]'
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Snapshots preserved successfully."
              exit 0
            fi
            echo "::warning::Remote branch changed while saving snapshots. Retrying ($attempt/4)."
            sleep $((attempt * 2))
          done
          # The refreshed site can still be deployed; a temporary push conflict
          # must never prevent readers from accessing the website.
          echo "::warning::Snapshot persistence unsuccessful after 4 attempts; deploying current data without committing it."
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Download seven audited CC BY 4.0 photos from related 2026 forums
        if: steps.publication.outputs.needed == 'true'
        run: python site/scripts/build_story_photos.py
        timeout-minutes: 5
        continue-on-error: true

      - name: Prepare static Pages site
        if: steps.publication.outputs.needed == 'true'
        run: |
          mkdir -p public
          cp site/index.html site/manifest.webmanifest site/service-worker.js public/
          cp site/research-studio.html site/sitemap.xml site/robots.txt site/refresh-status.json public/
          # GitHub Pages deploys only public/, not the repository root.
          # Preserve owner-provided Search Console / Yandex HTML verification files.
          if [ -d deploy/verification ]; then
            find deploy/verification -maxdepth 1 -type f \( -name 'google*.html' -o -name 'yandex_*.html' \) -exec cp -t public -- {} +
          fi
          cp -R site/assets site/data site/src public/
          if [ -f site/PHOTO_CREDITS.md ]; then cp site/PHOTO_CREDITS.md public/; fi
          touch public/.nojekyll

      - name: Configure Pages
        if: steps.publication.outputs.needed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.publication.outputs.needed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Wait until Pages artifact is visible in GitHub API
        if: steps.publication.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 15); do
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' 2>/dev/null | head -1 || true)"
            if [ -n "$artifact_id" ]; then
              echo "Pages artifact is available: $artifact_id"
              sleep 4
              exit 0
            fi
            echo "Artifact indexing not complete, attempt $attempt/15"
            sleep 5
          done
          echo "::error::Pages artifact was uploaded but could not be indexed by the GitHub API."
          exit 1
      - name: Deploy
        if: steps.publication.outputs.needed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
