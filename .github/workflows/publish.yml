name: Publish Diplomatic Atlas

on:
  push:
    branches: [main]
    paths:
      - site-package.zip
      - .github/workflows/publish.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: diplomatic-atlas-pages
  cancel-in-progress: false

jobs:
  verify-refresh-deploy:
    if: github.event_name != 'push' || github.event.head_commit.message != '[skip pages]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm website ZIP exists
        run: test -s site-package.zip

      - name: Extract only safe paths
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          archive = pathlib.Path('site-package.zip')
          target = pathlib.Path('site')
          target.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  p = pathlib.PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts or '\\' in info.filename:
                      raise SystemExit('Unsafe ZIP member: ' + info.filename)
                  if info.is_dir():
                      continue
                  dest = target.joinpath(*p.parts)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, dest.open('wb') as out:
                      import shutil
                      shutil.copyfileobj(src,out)
          for required in ('index.html','package.json','src/app.js','scripts/update_news.py'):
              assert (target/required).is_file(), f'Missing {required}'
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore retained snapshots from earlier successful runs
        run: |
          mkdir -p site/data
          for file in liveNews.json liveNews.js liveEvents.json liveEvents.js indicators.json indicators.js; do
            if [ -s "snapshot-cache/$file" ]; then
              cp "snapshot-cache/$file" "site/data/$file"
            fi
          done

      - name: Refresh news from eight publisher and institutional feeds
        id: news
        run: |
          cp site/data/liveNews.json /tmp/atlas-before-news.json
          (cd site && python scripts/update_news.py) || echo "RSS unavailable; retaining previous snapshot."
          if cmp -s /tmp/atlas-before-news.json site/data/liveNews.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract source-qualified geographic meeting pins
        run: |
          (cd site && python scripts/update_events.py --from-news-snapshot) || echo "No new city-verified meeting locations."

      - name: Cache free translation models
        if: steps.news.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-unofficial-language-models-v1
          restore-keys: argos-unofficial-language-models-

      - name: Install optional free translation engine
        if: steps.news.outputs.changed == 'true'
        run: python -m pip install --disable-pip-version-check 'argostranslate>=1.10,<2'
        timeout-minutes: 5
        continue-on-error: true

      - name: Translate new publisher headlines when offline models exist
        if: steps.news.outputs.changed == 'true'
        working-directory: site
        run: python scripts/update_translations.py --install-models
        timeout-minutes: 10
        continue-on-error: true

      - name: Refresh World Bank data only if six hours old
        run: |
          python - <<'PY'
          import pathlib,json,datetime as dt,subprocess
          p=pathlib.Path('site/data/indicators.json')
          last=None
          try:
              value=json.loads(p.read_text()).get('updated_at')
              if value:last=dt.datetime.fromisoformat(value.replace('Z','+00:00'))
          except (OSError,ValueError,TypeError):pass
          now=dt.datetime.now(dt.timezone.utc)
          if last is None or now-last>=dt.timedelta(hours=6):
              subprocess.run(['python','scripts/update_indicators.py'],cwd='site',check=False)
          else:print('WDI refresh not due yet.')
          PY

      - name: Validate snapshots and website
        working-directory: site
        run: |
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_news_fetch.py' -v
          python -m unittest discover -s tests -p 'test_events_fetch.py' -v
          python -m unittest discover -s tests -p 'test_indicators_fetch.py' -v
          python -m unittest discover -s tests -p 'test_translations.py' -v
          python -m unittest discover -s tests -p 'test_story_photos.py' -v

      - name: Preserve new snapshots as versioned repository data
        id: persist
        run: |
          mkdir -p snapshot-cache
          for file in liveNews.json liveNews.js liveEvents.json liveEvents.js indicators.json indicators.js; do
            cp "site/data/$file" "snapshot-cache/$file"
          done
          git add snapshot-cache
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new records; deployment not required."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh news and venue snapshots [skip pages]'
            git push
          fi

      - name: Download seven audited CC BY 4.0 photos from related 2026 forums
        run: python site/scripts/build_story_photos.py
        timeout-minutes: 5
        continue-on-error: true

      - name: Prepare static Pages site
        if: steps.persist.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir -p public
          cp site/index.html site/manifest.webmanifest site/service-worker.js public/
          cp -R site/assets site/data site/src public/
          if [ -f site/PHOTO_CREDITS.md ]; then cp site/PHOTO_CREDITS.md public/; fi
          touch public/.nojekyll

      - name: Configure Pages
        if: steps.persist.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.persist.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        if: steps.persist.outputs.changed == 'true' || github.event_name != 'schedule'
        id: deployment
        uses: actions/deploy-pages@v4
