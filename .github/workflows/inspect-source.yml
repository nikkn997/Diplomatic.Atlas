name: Extract public frontend for maintenance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-source.yml
      - site-package.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-source-inspection
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract only known public source files from the original package
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          target=pathlib.Path('/tmp/atlas-source')
          allowed=('index.html','src/app.js','src/styles.css','service-worker.js',
                   'scripts/update_events.py','scripts/update_news.py','scripts/update_translations.py')
          with zipfile.ZipFile('site-package.zip') as archive:
              for name in allowed:
                  if name not in archive.namelist():
                      print('Not present:',name)
                      continue
                  path=target/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_text(archive.read(name).decode('utf-8'),encoding='utf-8')
          assert (target/'src/app.js').is_file(), 'App source missing'
          PY
      - name: Save inspection copies without changing deployed website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git reset --hard FETCH_HEAD
            mkdir -p maintenance/source
            cp -R /tmp/atlas-source/. maintenance/source/
            git add maintenance/source
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'chore: expose public source for maintenance [skip pages]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
